<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>热血传奇 · Legend of Mir — Three.js</title>
<link rel="stylesheet" href="./styles/ui.css" />

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/webgpu": "./vendor/three/three.module.js",
    "three/tsl": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>

<canvas id="stage"></canvas>

<!-- ============================ BOOT / LOADING ============================ -->
<div id="boot" class="boot">
  <div class="boot-vignette"></div>
  <div class="boot-inner">
    <h1 class="boot-title">热血传奇</h1>
    <p class="boot-sub">LEGEND&nbsp;OF&nbsp;MIR &nbsp;·&nbsp; THREE.JS EDITION</p>
    <div class="boot-barwrap"><div class="boot-bar" id="bootBar"></div></div>
    <p class="boot-status" id="bootStatus">正在铸造世界…</p>
  </div>
</div>

<!-- ============================ CHARACTER SELECT ========================== -->
<div id="charsel" class="charsel hidden">
  <div class="cs-panel">
    <div class="cs-head">选择你的职业</div>
    <div class="cs-classes" id="csClasses"></div>
    <div class="cs-namerow">
      <label>角色名</label><input id="csName" maxlength="7" value="无名少侠" />
    </div>
    <div class="cs-desc" id="csDesc"></div>
    <button class="cs-go" id="csGo">进 入 玛 法 大 陆</button>
  </div>
</div>

<!-- ============================ IN-GAME UI ROOT =========================== -->
<div id="ui" class="ui hidden">
  <div id="uiTop"></div>
  <div id="uiWorld"></div>     <!-- world-anchored: nameplates, damage numbers -->
  <div id="uiBottom"></div>
  <div id="uiPanels"></div>    <!-- inventory / character / skills windows -->
  <div id="uiToast"></div>
</div>

<div id="fatal" class="fatal hidden"><pre id="fatalMsg"></pre></div>

<script type="module">
  const bar = document.getElementById('bootBar');
  const st  = document.getElementById('bootStatus');
  window.__boot = (p, msg) => {
    if (bar) bar.style.width = Math.max(0, Math.min(1, p)) * 100 + '%';
    if (msg && st) st.textContent = msg;
  };
  const fatal = (e) => {
    const box = document.getElementById('fatal');
    const msg = document.getElementById('fatalMsg');
    if (!box || !msg) return;
    box.classList.remove('hidden');
    msg.textContent = (msg.textContent + '\n' + (e && (e.stack || e.message || e))).trim();
    console.error(e);
  };
  window.addEventListener('error', (e) => fatal(e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => fatal(e.reason));

  import('./src/main.js').catch(fatal);
</script>
