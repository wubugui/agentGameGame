<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>暴躁老哥 · Vibe Coding 模拟器</title>
<style>
:root{
  --bg:#0a0c12; --ink:#e8ecf5; --dim:#7c879b; --line:#262d3b;
  --rage:#ff4d4d; --sanity:#54a9ff; --energy:#ffcb3d; --cash:#3ddc84; --accent:#ff7a3c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#000;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:460px;height:100dvh;position:relative;background:var(--bg);overflow:hidden}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;z-index:40;padding:7px 9px;display:flex;gap:5px;align-items:center;
  background:linear-gradient(#0a0c12f0,#0a0c1200);pointer-events:none}
.daybadge{font-weight:900;font-size:12px;background:#0a0c12dd;border:1px solid var(--line);border-radius:8px;padding:4px 8px;white-space:nowrap;line-height:1.15}
.daybadge small{color:var(--dim);font-weight:600;font-size:9px}
.gauges{flex:1;display:flex;gap:4px}
.g{flex:1;background:#0a0c12dd;border:1px solid var(--line);border-radius:8px;padding:3px 5px;overflow:hidden}
.g .ic{font-size:11px;line-height:1}.g .num{font-size:11px;font-weight:800}
.g .track{height:3px;background:#000;border-radius:9px;margin-top:2px;overflow:hidden}
.g .track>i{display:block;height:100%;border-radius:9px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.g.flash{animation:gflash .5s}@keyframes gflash{30%{transform:scale(1.13)}}
.rg .track>i{background:var(--rage)}.sn .track>i{background:var(--sanity)}.en .track>i{background:var(--energy)}.cs .track>i{background:var(--cash)}

/* ---------- SCENE (backdrop) ---------- */
#scene{position:absolute;inset:0;z-index:1;overflow:hidden;transition:filter .4s}
#scene.dim{filter:brightness(.45) blur(2px)}
#sky{position:absolute;inset:0;transition:background 1.2s}
.win{position:absolute;top:8%;right:7%;width:33%;height:28%;border:5px solid #11151f;border-radius:8px;background:linear-gradient(180deg,#0e1830,#1b2747);overflow:hidden}
.win::before{content:"";position:absolute;inset:0;background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 60% 50%,#fff9,transparent),radial-gradient(1px 1px at 80% 20%,#fff7,transparent),radial-gradient(1px 1px at 40% 70%,#fffa,transparent);opacity:.7}
.moon{position:absolute;top:14%;left:18%;width:24px;height:24px;border-radius:50%;background:#f2efd6;box-shadow:0 0 16px #f2efd680;transition:.8s}
.deskline{position:absolute;left:0;right:0;bottom:23%;height:2px;background:#000a;box-shadow:0 -16px 30px #0008}
.desk{position:absolute;left:0;right:0;bottom:0;height:23%;background:linear-gradient(#1a2030,#10131c)}
.mon{position:absolute;left:7%;bottom:24%;width:38%;height:28%;border:4px solid #0c0f17;border-radius:7px;background:#050a14;overflow:hidden}
.mon .code{position:absolute;inset:0;padding:5px 6px;font-family:ui-monospace,Menlo,monospace;font-size:6.5px;line-height:1.5;color:#37e07a;opacity:.85;white-space:pre;animation:scroll 9s linear infinite}
@keyframes scroll{to{transform:translateY(-50%)}}
.mon .glow{position:absolute;inset:0;box-shadow:inset 0 0 22px #37e07a44}
.monstand{position:absolute;left:22%;bottom:21%;width:5%;height:4%;background:#0c0f17}
.cups{position:absolute;right:9%;bottom:24%;display:flex;gap:2px;align-items:flex-end}
.cup{font-size:14px;filter:drop-shadow(0 2px 2px #0008)}

/* CHARACTER (same proven SVG approach) */
#charWrap{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);width:50%;max-width:215px;z-index:6}
#char{width:100%;display:block;overflow:visible}
.breathe{animation:breathe 3.4s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(-1.5%)}}
#charWrap.shake{animation:cshake .28s infinite}@keyframes cshake{25%{transform:translate(-53%,1px)}75%{transform:translate(-47%,-1px)}}
#char .eyes>g,#char .mouth>path{display:none}
#char .brow{transition:transform .25s}
#char .fire,#char .steam,#char .sweat,#char .vein,#char .blush{opacity:0;transition:opacity .3s}
#char .face{transition:fill .4s}
.m-calm .e-norm,.m-calm .mo-smile{display:block}.m-calm .browL{transform:translateY(2px)}.m-calm .browR{transform:translateY(2px)}
.m-focus .e-norm,.m-focus .mo-flat{display:block}
.m-annoyed .e-norm,.m-annoyed .mo-frown{display:block}.m-annoyed .browL{transform:rotate(12deg) translateY(1px)}.m-annoyed .browR{transform:rotate(-12deg) translateY(1px)}.m-annoyed .vein{opacity:.9}
.m-angry .e-rage,.m-angry .mo-grit{display:block}.m-angry .browL{transform:rotate(20deg)}.m-angry .browR{transform:rotate(-20deg)}.m-angry .face{fill:#ffb3a0}.m-angry .vein{opacity:1}.m-angry .steam{opacity:.8}
.m-rage .e-rage,.m-rage .mo-yell{display:block}.m-rage .browL{transform:rotate(26deg) translateY(-1px)}.m-rage .browR{transform:rotate(-26deg) translateY(-1px)}.m-rage .face{fill:#ff8e76}.m-rage .fire{opacity:1}.m-rage .steam{opacity:1}.m-rage .vein{opacity:1}
.m-dead .e-x,.m-dead .mo-flat{display:block}.m-dead .face{fill:#cfd6df}.m-dead .sweat{opacity:.9}.m-dead .browL{transform:translateY(4px) rotate(-8deg)}.m-dead .browR{transform:translateY(4px) rotate(8deg)}
.m-happy .e-happy,.m-happy .mo-open{display:block}.m-happy .browL{transform:translateY(-1px)}.m-happy .browR{transform:translateY(-1px)}.m-happy .blush{opacity:.8}
.firewrap{animation:flick .12s infinite alternate}@keyframes flick{to{transform:scaleY(1.12)}}

#speech{position:absolute;left:50%;bottom:58%;transform:translateX(-50%);z-index:8;background:#fff;color:#15171d;font-size:13px;font-weight:700;line-height:1.35;padding:9px 12px;border-radius:13px;max-width:74%;text-align:center;box-shadow:0 6px 20px #000a;opacity:0;transition:opacity .25s;pointer-events:none}
#speech.show{opacity:1}
#speech::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff;border-bottom:0}
#speech.angry{background:#ffe3da;color:#8a1a00}#speech.angry::after{border-top-color:#ffe3da}

/* FX */
#fx{position:absolute;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.float{position:absolute;font-weight:900;font-size:17px;animation:floatUp 1.1s ease-out forwards;text-shadow:0 2px 4px #000}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-8px) scale(1.1)}100%{opacity:0;transform:translateY(-72px) scale(1)}}
.burst{position:absolute;font-size:22px;animation:burst .9s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
#flashfx{position:absolute;inset:0;z-index:55;pointer-events:none;opacity:0;background:radial-gradient(circle,#ff4d4d55,transparent 70%)}
#flashfx.on{animation:redflash .4s}@keyframes redflash{30%{opacity:1}}

/* ---------- OVERLAY / SCREENS ---------- */
#overlay{position:absolute;inset:0;z-index:30;display:none}
#overlay.on{display:block}
.screen{position:absolute;inset:0;animation:slideUp .35s cubic-bezier(.2,.9,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}

/* tap-to-continue full prompts (wake) */
.tap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:18%;z-index:35;background:linear-gradient(#0a0c1200,#0a0c12cc)}
.tap .big{font-size:16px;font-weight:800;margin-bottom:6px;text-align:center;padding:0 24px}
.tap .hint{color:var(--dim);font-size:12px;animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.3}}

/* ===== PHONE (news app) ===== */
.phone{position:absolute;top:3%;left:50%;transform:translateX(-50%);width:92%;max-width:410px;height:94%;
  background:#0d1017;border:8px solid #05070b;border-radius:34px;overflow:hidden;
  box-shadow:0 18px 50px #000c, inset 0 0 0 2px #1a2030}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:38%;height:20px;background:#05070b;border-radius:0 0 14px 14px;z-index:5}
.pstat{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:11px;font-weight:700;color:#cfe;background:#0d1017}
.pstat .r{display:flex;gap:5px;align-items:center}
.appbar{height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;background:linear-gradient(90deg,#ff3b3b,#ff7a3c);color:#fff;font-weight:900;font-size:16px}
.appbar .live{margin-left:auto;font-size:10px;background:#fff3;padding:2px 7px;border-radius:99px;font-weight:700}
.feed{position:absolute;top:122px;left:0;right:0;bottom:0;overflow-y:auto;background:#0d1017;padding:8px 8px 90px;-webkit-overflow-scrolling:touch}
.post{background:#141822;border:1px solid #1e2532;border-radius:14px;margin-bottom:9px;overflow:hidden;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:center;gap:8px;padding:10px 11px 7px}
.pav{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.pname{font-weight:800;font-size:13px;display:flex;align-items:center;gap:4px}
.pverif{color:#ff3b3b;font-size:11px}
.ptime{color:var(--dim);font-size:10px}
.pcat{margin-left:auto;font-size:9px;font-weight:800;padding:2px 7px;border-radius:6px}
.pbody{padding:0 12px 9px;font-size:13.5px;line-height:1.55}
.pbody b{color:#ffd24d}
.pimg{height:118px;margin:2px 0 0;display:flex;align-items:center;justify-content:center;gap:10px;font-size:40px;position:relative;overflow:hidden}
.pimg .tagline{position:absolute;bottom:6px;left:8px;font-size:10px;font-weight:800;color:#fff;background:#0007;padding:2px 7px;border-radius:6px}
.pstats{display:flex;gap:16px;padding:8px 14px;color:var(--dim);font-size:11px;border-top:1px solid #1e2532}
.pstats span{display:flex;gap:3px;align-items:center}
.hot{margin:0 11px 10px;background:#0d1017;border-radius:9px;padding:7px 9px;font-size:11.5px;line-height:1.4}
.hot .hu{color:#7fb0ff;font-weight:700}
.hot .hl{color:var(--dim);float:right}
.tucao{margin:2px 11px 11px}
.tucaoBtn{width:100%;background:#1e2532;border:1px solid #2a3445;color:#ff9b6b;font-weight:800;font-size:13px;padding:9px;border-radius:10px;font-family:inherit;cursor:pointer}
.tucaoBtn:active{transform:scale(.98)}
.reacts{display:flex;flex-direction:column;gap:7px;margin-top:8px;animation:rise .2s}
.react{display:flex;gap:9px;align-items:center;background:#10141d;border:1px solid #2a3445;border-radius:10px;padding:9px 10px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
.react:active{transform:scale(.98);background:#161c28}
.react .rico{font-size:18px}.react .rt{font-weight:700;font-size:13px}
.react .rd{font-size:10.5px;color:var(--dim);margin-top:1px}
.reacted{padding:9px 10px;background:#0f1722;border:1px dashed #2a3445;border-radius:10px;font-size:12px;color:#7fd0a0;margin-top:8px}
.reacted b{color:#ffb38a}
.ambient{background:#10141d;border:1px dashed #1e2532;border-radius:12px;margin-bottom:9px;padding:9px 12px;font-size:12px;color:var(--dim)}
.ambient .a-img{font-size:22px;margin-right:6px}
.closephone{position:absolute;left:0;right:0;bottom:0;padding:11px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(#0d101700,#0d1017 40%)}
.bigbtn{display:block;width:100%;background:linear-gradient(135deg,#ff7a3c,#ff4d4d);color:#1a0c05;border:none;padding:14px;border-radius:13px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px #ff4d4d44}
.bigbtn:active{transform:scale(.98)}
.bigbtn:disabled{background:#2a3140;color:#5a6477;box-shadow:none}

/* ===== bottom panel for buff/work/settle ===== */
.panel{position:absolute;left:0;right:0;bottom:0;z-index:32;padding:14px 12px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(#0a0c1200,#0a0c12 14%);max-height:70%;overflow-y:auto}
.ptag{display:inline-block;font-size:11px;font-weight:800;color:#0a0c12;background:var(--accent);padding:3px 10px;border-radius:99px;margin-bottom:8px}
.sheet{background:#12151fee;backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:13px;animation:rise .3s ease;margin-bottom:9px}
.sheet h2{margin:0 0 3px;font-size:15px}.sheet .sub{color:var(--dim);font-size:12px;margin-bottom:11px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;background:#171b27;border:1px solid var(--line);color:var(--ink);padding:11px 12px;border-radius:12px;font-family:inherit;font-size:14px;cursor:pointer;transition:.12s;display:flex;gap:10px;align-items:center}
.opt:active{transform:scale(.98);background:#1e2433}
.opt .ico{font-size:22px;flex:none}.opt .t{font-weight:700}.opt .d{color:var(--dim);font-size:12px;margin-top:2px}
.opt .tag{margin-left:auto;font-size:10px;font-weight:800;color:var(--energy);white-space:nowrap}
.opt:disabled{opacity:.4}

/* IDE work screen */
.bigprog{height:14px;background:#05070b;border-radius:9px;overflow:hidden;margin:8px 0 6px;border:1px solid #1e2532}
.bigprog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--cash));width:0;transition:width .5s cubic-bezier(.2,.9,.2,1)}
.milestones{display:flex;justify-content:space-between;font-size:9px;color:#4a5468;margin-bottom:8px}
.statline{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;background:#1c2130;border:1px solid var(--line);padding:3px 8px;border-radius:8px;color:var(--dim)}
.chip.up{color:var(--cash);border-color:#3ddc8455}.chip.down{color:var(--rage);border-color:#ff4d4d55}
.ide{background:#05070b;border:1px solid #1e2532;border-radius:10px;font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:9px;color:#7fe0a0;min-height:54px;line-height:1.6;white-space:pre-wrap;margin-bottom:9px}
.ide .cm{color:#5a6477}.ide .er{color:#ff7a7a}

/* agent chat */
.chat{display:flex;flex-direction:column;gap:7px;margin:4px 0 10px}
.bub{max-width:84%;padding:8px 11px;border-radius:13px;font-size:13px;line-height:1.4;animation:rise .25s}
.bub.ag{align-self:flex-start;background:#1b2433;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:#3a1e12;border:1px solid #5a2a16;border-bottom-right-radius:4px}
.bub .who{font-size:10px;color:var(--dim);margin-bottom:3px}
.typing{align-self:flex-start;color:var(--dim);font-size:12px}.typing::after{content:"●●●";animation:blink 1s infinite}

/* vibe coding: tickets / hunks / combo */
.combobadge{font-size:11px;font-weight:900;color:#ffae3c;margin-left:6px;animation:gflash .5s}
.board{display:flex;flex-direction:column;gap:8px}
.ticket{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#171b27;border:1px solid var(--line);border-radius:12px;padding:10px 11px;color:var(--ink);font-family:inherit;cursor:pointer;transition:.12s}
.ticket:active{transform:scale(.98);background:#1e2433}
.ticket:disabled{opacity:.4}
.tk-ic{font-size:24px;flex:none}
.tk-meta{flex:1;min-width:0}
.tk-nm{font-weight:800;font-size:14px}.tk-base{color:var(--cash);font-size:12px;margin-left:4px}
.tk-tag{color:var(--dim);font-size:11px;margin-top:2px}
.tk-go{color:var(--accent);font-weight:800;font-size:13px;flex:none}
.hunks{display:flex;flex-direction:column;gap:8px;margin:4px 0 10px}
.hunk{background:#05070b;border:1px solid #1e2532;border-radius:10px;padding:8px 9px;transition:.15s}
.hunk code{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#cfe0d6;white-space:pre-wrap;word-break:break-all;line-height:1.5}
.hunk .hbtns{display:flex;gap:7px;margin-top:7px}
.hbtn{flex:1;border:1px solid #2a3445;background:#10141d;color:var(--dim);font-weight:800;font-size:12px;padding:7px;border-radius:8px;font-family:inherit;cursor:pointer}
.hbtn.merge.on{background:#13351f;border-color:#3ddc84;color:#7fe0a0}
.hbtn.reject.on{background:#3a1414;border-color:#ff6b6b;color:#ff9b9b}
.hbtn:active{transform:scale(.97)}
.hunk.pick-merge{border-color:#2a4a36}.hunk.pick-reject{border-color:#4a2a2a}

/* day report */
.report .row{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.report .row b{font-weight:800}
.report .big{font-size:30px;font-weight:900;text-align:center;margin:6px 0}
.report .pos{color:var(--cash)}.report .neg{color:var(--rage)}

/* end */
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:45;background:#0a0c12e8}
.end .em{font-size:66px;animation:pop .5s}@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.end h1{margin:8px 0 4px}.end p{color:var(--dim);margin:4px 0}
</style>
</head>
<body>
<div id="app">

  <!-- HUD -->
  <div id="hud">
    <div class="daybadge">DAY <span id="day">1</span><br><small id="goalTxt">/30 别破产</small></div>
    <div class="gauges">
      <div class="g rg" id="gRage"><span class="ic">🔥</span><span class="num" id="vRage">50</span><div class="track"><i id="bRage"></i></div></div>
      <div class="g sn" id="gSanity"><span class="ic">🧠</span><span class="num" id="vSanity">70</span><div class="track"><i id="bSanity"></i></div></div>
      <div class="g en" id="gEnergy"><span class="ic">⚡</span><span class="num" id="vEnergy">80</span><div class="track"><i id="bEnergy"></i></div></div>
      <div class="g cs" id="gCash"><span class="ic">💰</span><span class="num" id="vCash">1k</span><div class="track"><i id="bCash"></i></div></div>
    </div>
  </div>

  <!-- SCENE -->
  <div id="scene">
    <div id="sky"></div>
    <div class="win"><div class="moon" id="moon"></div></div>
    <div class="monstand"></div>
    <div class="mon"><div class="code" id="code"></div><div class="glow"></div></div>
    <div class="cups" id="cups"></div>
    <div class="deskline"></div><div class="desk"></div>
    <div id="charWrap">
      <svg id="char" class="breathe m-focus" viewBox="0 0 200 200">
        <g class="fire firewrap"><path d="M100 40 C70 70 60 110 100 140 C140 110 130 70 100 40Z" fill="#ff5a1a" opacity=".5"/><path d="M100 60 C82 82 78 110 100 130 C122 110 118 82 100 60Z" fill="#ffb13c" opacity=".7"/></g>
        <path d="M40 200 C40 150 60 132 100 132 C140 132 160 150 160 200Z" fill="#2a3142"/>
        <path d="M70 134 C80 150 120 150 130 134 L130 132 L70 132Z" fill="#222838"/>
        <ellipse class="face" cx="100" cy="92" rx="46" ry="48" fill="#f3c9a8"/>
        <ellipse class="face" cx="55" cy="95" rx="7" ry="11" fill="#f3c9a8"/><ellipse class="face" cx="145" cy="95" rx="7" ry="11" fill="#f3c9a8"/>
        <path d="M55 78 C58 44 142 44 145 78 C140 64 60 64 55 78Z" fill="#2b2620"/>
        <path d="M50 92 C46 50 154 50 150 92" stroke="#15181f" stroke-width="7" fill="none" stroke-linecap="round"/>
        <rect x="40" y="84" width="16" height="26" rx="6" fill="#15181f"/><rect x="144" y="84" width="16" height="26" rx="6" fill="#15181f"/>
        <g class="blush"><circle cx="70" cy="108" r="7" fill="#ff7a7a" opacity=".5"/><circle cx="130" cy="108" r="7" fill="#ff7a7a" opacity=".5"/></g>
        <g class="vein" transform="translate(120,58)"><path d="M0 6 L6 0 M6 0 L12 6 M6 0 L6 10" stroke="#ff2d2d" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
        <g class="brow browL" style="transform-origin:78px 78px"><rect x="62" y="74" width="30" height="6" rx="3" fill="#2b2620"/></g>
        <g class="brow browR" style="transform-origin:122px 78px"><rect x="108" y="74" width="30" height="6" rx="3" fill="#2b2620"/></g>

  if(!v)return;
  if(key==='cash')S.cash=Math.max(0,S.cash+v);else S[key]=clamp(S[key]+v);
  const map={rage:'gRage',sanity:'gSanity',energy:'gEnergy',cash:'gCash'};
  const g=$(map[key]);g.classList.remove('flash');void g.offsetWidth;g.classList.add('flash');
  renderHUD();
  if(!silent)floatNum((v>0?'+':'')+v,v>0?'#3ddc84':'#ff6b6b',32+Math.random()*38,40);
}
function applyEff(e){if(!e)return;for(const k in e)delta(k,e[k]);}

function paintSky(){const t=(S.day-1)/S.maxDay;$('sky').style.background=t>.75?'linear-gradient(180deg,#070b18,#0c1226 55%,#0a0c12)':t>.45?'linear-gradient(180deg,#2a2140,#3a2330 50%,#120e16)':'linear-gradient(180deg,#26405e,#33506e 50%,#101620)';$('moon').style.opacity=t>.45?1:.15;}
function renderHUD(){
  $('day').textContent=S.day;
  $('vRage').textContent=Math.round(S.rage);$('vSanity').textContent=Math.round(S.sanity);
  $('vEnergy').textContent=Math.round(S.energy);$('vCash').textContent=fmtK(Math.round(S.cash));
  $('bRage').style.width=clamp(S.rage)+'%';$('bSanity').style.width=clamp(S.sanity)+'%';
  $('bEnergy').style.width=clamp(S.energy)+'%';$('bCash').style.width=clamp(S.cash/30)+'%';
  const c=$('cups');c.innerHTML='';for(let i=0;i<Math.min(5,S.cupCount);i++){const s=document.createElement('span');s.className='cup';s.textContent=i%2?'🥤':'☕';c.appendChild(s);}
  paintSky();
}

window.openReacts=function(id,btn){SFX.tap();btn.style.display='none';$('re-'+id).style.display='flex';};
window.doReact=function(id,i){
  const n=dayNews.find(x=>x.id===id);const r=n.reacts[i];
  n._chosen=r.t;reactedSet.add(id);
  applyEff(r.eff);
  // special extras
  if(r.extra==='fame'){S.proj.users+=Math.round(15+Math.random()*30);}
  if(r.extra==='save'){S.proj.users+=5;}
  if(r.extra==='lose'){S.proj.users=Math.max(0,S.proj.users-Math.round(10+Math.random()*20));}
  if(r.extra==='debt'){S.proj.debt++;}
  if(r.extra==='gamble'){const win=Math.random()<.5;if(win){delta('cash',400);S.proj.users+=20;burst('💰',6);}else{delta('cash',-300);}n._chosen+=win?'（梭哈成功！）':'（梭哈血亏…）';}
  // feedback
  if(r.kind==='rage'){SFX.bad();shake();flashMood('angry');burst('💢',4);}
  else if(r.kind==='cry'){SFX.bad();flashMood('dead');burst('💧',3);}
  else if(r.kind==='win'){SFX.good();flashMood('happy');burst('✨',5);}
  else {SFX.tap();flashMood('annoyed');}
  say(r.t.replace(/"/g,''), r.kind==='rage');
  // re-render this post + maybe enable close
  $('post-'+id).outerHTML=postHTML(n);
  const allReacted=dayNews.every(x=>reactedSet.has(x.id));
  const cb=$('closeBtn');if(allReacted&&cb){cb.disabled=false;cb.textContent='📴 收起手机，起床干活 →';}
};

window.pickPrompt=function(pid){
  const p=PROMPTS.find(x=>x.id===pid);WCTX.prompt=p;
  if(S.energy<p.cost){say('"精力不够了…"',true);SFX.bad();return;}
  delta('energy',-p.cost);S.cupCount++;actionsToday++;
  if(p.rage)delta('rage',p.rage);
  WCTX.agent.temper=clamp(WCTX.agent.temper+p.temper);
  SFX.tap();
  // 生成 hunks
  let badProb=clamp(WCTX.agent.hallu - p.care + (S.rageMode?0.12:0) + WCTX.agent.temper/400, 0.05, 0.8);
  const n=4;const hunks=[];
  for(let i=0;i<n;i++){
    const bad=Math.random()<badProb;
    if(bad){const b=rand(BAD_CODE);hunks.push({bad:true,code:b.c,why:b.why,decision:null});}
    else hunks.push({bad:false,code:rand(GOOD_CODE),why:'看着没毛病',decision:null});
  }
  if(hunks.every(h=>h.bad)) hunks[0]={bad:false,code:rand(GOOD_CODE),why:'看着没毛病',decision:null}; // 至少留一条好的
  WCTX.hunks=hunks;WCTX.decided=0;
  // 流式生成动画
  const promptLine=({detail:'"实现'+WCTX.ticket.nm+'，注意边界和鉴权，写测试。"',normal:'"帮我写下'+WCTX.ticket.nm+'。"',angry:'"'+WCTX.ticket.nm+'！赶紧给我写！别废话！"'})[p.id];
  panel(`<div class="ptag">⌨️ 生成中…</div>
    <div class="sheet">
      <div class="chat"><div class="bub me"><div class="who">暴躁老哥 🔥</div>${promptLine}</div></div>
      <div class="bub ag" style="margin:0 0 8px"><div class="who">${WCTX.agent.face} ${WCTX.agent.nm}</div><span id="agThink">${rand(['收到，这就写…','好嘞，安排…','这还不简单…','让我想想…'])}</span></div>
      <div class="ide" id="gen"></div>
    </div>`);
  streamCode($('gen'),hunks,()=>setTimeout(reviewScreen,350));
  if(p.id==='angry'){flashMood('angry');}
};

function streamCode(el,hunks,done){
  const lines=['$ agent generate --feature "'+WCTX.ticket.nm+'"','> 分析需求…','> 写代码…',...hunks.map(h=>h.code),'> done. 等待 review ✋'];
  let i=0;el.innerHTML='';
  (function next(){
    if(i>=lines.length){done&&done();return;}
    const ln=lines[i++];const span=document.createElement('div');
    span.className = ln.startsWith('>')||ln.startsWith('$')?'cm':'';
    el.appendChild(span);
    // 逐字
    let j=0;const t=setInterval(()=>{span.textContent=ln.slice(0,++j);if(j%2===0)SFX.type();if(j>=ln.length){clearInterval(t);el.scrollTop=el.scrollHeight;next();}},14);
  })();
}

function reviewScreen(){
  const hunkHTML=WCTX.hunks.map((h,i)=>`<div class="hunk" id="hunk-${i}">
     <code>${h.code.replace(/</g,'&lt;')}</code>
     <div class="hbtns">
       <button class="hbtn merge" onclick="decide(${i},'merge')">✅ 合并</button>
       <button class="hbtn reject" onclick="decide(${i},'reject')">🔁 打回</button>
     </div></div>`).join('');
  panel(`<div class="ptag">🔍 Code Review · 找茬</div>
    <div class="sheet">
      <div class="bub ag" style="margin-bottom:8px"><div class="who">${WCTX.agent.face} ${WCTX.agent.nm}</div>"写完了！${WCTX.agent.hallu>0.3?'应该没问题吧（心虚）':'自测过了，合了吧？'}"</div>
      <div class="sub">逐段审：把<b style="color:#ff8a8a">有问题的打回</b>，正常的合并。打回坏代码=干净加分，放过坏代码=埋 bug 断连击；误杀好代码=白干。</div>
      <div class="hunks">${hunkHTML}</div>
      <button class="bigbtn" id="runBtn" disabled style="margin-top:6px">先把 4 段都审完</button>
    </div>`);
}
window.decide=function(i,d){
  const h=WCTX.hunks[i];if(h.decision===null)WCTX.decided++;h.decision=d;
  SFX.tap();
  const el=$('hunk-'+i);el.className='hunk '+(d==='merge'?'pick-merge':'pick-reject');
  el.querySelectorAll('.hbtn').forEach(b=>b.classList.remove('on'));
  el.querySelector(d==='merge'?'.merge':'.reject').classList.add('on');
  if(WCTX.decided>=WCTX.hunks.length){const b=$('runBtn');b.disabled=false;b.textContent='🧪 运行测试并合并 →';b.onclick=runTests;}
};

function runTests(){
  SFX.tap();
  const goodCount=WCTX.hunks.filter(h=>!h.bad).length;
  const perGood=(WCTX.ticket.base*WCTX.prompt.out*(S.rageMode?1.1:1))/Math.max(1,goodCount);
  let gained=0,shippedBugs=0,caught=0,wrongKill=0;
  WCTX.hunks.forEach(h=>{
    if(!h.bad && h.decision==='merge') gained+=perGood;          // 正确合并
    else if(!h.bad && h.decision==='reject') wrongKill++;          // 误杀
    else if(h.bad && h.decision==='reject') caught++;              // 抓到了
    else if(h.bad && h.decision==='merge') shippedBugs++;          // 放过坏的
  });
  // combo
  let comboBonus=0;
  if(shippedBugs===0 && gained>0){S.combo++;comboBonus=gained*(S.combo>1?Math.min(0.5,(S.combo-1)*0.10):0);}
  else if(shippedBugs>0){S.combo=0;}
  gained+=comboBonus;
  S.proj.bugs+=shippedBugs;
  if(shippedBugs>0 && Math.random()<0.5)S.proj.debt++;
  if(caught>0)delta('sanity',Math.min(6,caught*2));
  if(wrongKill>0){WCTX.agent.temper=clamp(WCTX.agent.temper+wrongKill*4);delta('rage',wrongKill*2);}
  // 测试运行动画
  const tests=['auth.spec','api.spec','ui.spec','e2e.spec'];
  let pass=tests.length-shippedBugs;
  panel(`<div class="ptag">🧪 测试运行中…</div>
    <div class="sheet"><div class="ide" id="trun"></div>
      <div class="bigprog"><i style="width:${clamp(S.proj.done)}%"></i></div>
      <div class="milestones">${workMilestones()}</div>
      <button class="bigbtn" id="afterTest" disabled>跑测试中…</button></div>`);
  const tr=$('trun');let k=0;
  const iv=setInterval(()=>{
    if(k>=tests.length){clearInterval(iv);afterTests(gained,shippedBugs,caught,wrongKill,comboBonus);return;}
    const ok=k<pass;const d=document.createElement('div');
    d.innerHTML=ok?`<span style="color:#7fe0a0">✓ PASS</span> ${tests[k]}`:`<span class="er">✗ FAIL</span> ${tests[k]} <span class="er">(线上 bug)</span>`;
    tr.appendChild(d);tr.scrollTop=tr.scrollHeight;ok?SFX.good():SFX.bad();k++;
  },420);
}
function afterTests(gained,bugs,caught,wrongKill,comboBonus){
  if(bugs===0&&gained>0){flashMood('happy');burst('✨',5);}
  else if(bugs>0){flashMood('angry');shake();redflash();burst('💢',5);}
  else flashMood('annoyed');
  if(gained>0)floatNum('+'+gained.toFixed(0)+'%','#3ddc84',50,46);
  // 结算文案
  const lines=[];
  if(caught>0)lines.push(`🔎 抓出 <b style="color:#7fd0a0">${caught}</b> 段问题代码，干净！`);
  if(bugs>0)lines.push(`🐛 放过了 <b class="er">${bugs}</b> 段，bug 上线，连击断了。`);
  if(wrongKill>0)lines.push(`😤 误杀 ${wrongKill} 段好代码，agent 不爽了。`);
  if(comboBonus>0)lines.push(`🔥 COMBO ×${S.combo}！额外 +${comboBonus.toFixed(0)}%`);
  if(!lines.length)lines.push('一次普通的合并。');
  const meLine=bugs>0?rand(['"谁让你写成这样的！"','"上线就炸，典型。"']):(caught>0?rand(['"想糊弄我？没门。"','"还好老子眼尖。"']):'"行，过。"');
  say(meLine.replace(/"/g,''),bugs>0);
  panel(`<div class="ptag">📋 合并结果</div>
    <div class="sheet">
      <div class="bub me" style="margin-bottom:8px"><div class="who">暴躁老哥 🔥</div>${meLine}</div>
      <div class="ide">${lines.join('\n')}</div>
      <div class="bigprog"><i style="width:${clamp(S.proj.done)}%"></i></div>
      <div class="milestones">${workMilestones()}</div>
      <button class="bigbtn" id="contBtn" disabled style="margin-top:8px">合并中…</button>
    </div>`);
  setTimeout(()=>tweenProgress(S.proj.done+gained,()=>{
    rollTickets();
    const b=$('contBtn');if(b){b.disabled=false;b.textContent='继续干活 / 收工 →';b.onclick=()=>{SFX.tap();go('work');};}
  }),450);
}

window.selfCode=function(){
  if(S.energy<22){say('"太累了，写不动…"',true);SFX.bad();return;}
  delta('energy',-22);S.cupCount++;actionsToday++;SFX.tap();
  const moody=S.buffs.includes('摆烂')?.5:1;
  let out=(2+S.rage*.04)*moody*(S.rageMode?2:1),bugs=0;
  if(S.buffs.includes('手抖')&&Math.random()<.5)bugs=1;
  if(S.rageMode&&Math.random()<.4)bugs+=2;
  S.proj.bugs+=bugs;if(bugs>0)S.combo=0;else S.combo++;
  panel(`<div class="ptag">🙋 亲自上手</div><div class="sheet"><div class="ide" id="self"></div>
    <div class="bigprog"><i style="width:${clamp(S.proj.done)}%"></i></div><div class="milestones">${workMilestones()}</div>
    <button class="bigbtn" id="contBtn" disabled>编译中…</button></div>`);
  streamCode($('self'),[{code:'+ '+rand(GOOD_CODE).slice(2)},{code:'+ '+(bugs?rand(BAD_CODE).c.slice(2):rand(GOOD_CODE).slice(2))}],()=>{
    const s=$('self');if(s)s.innerHTML+=`\n<span style="color:#7fe0a0">+ ${out.toFixed(0)}% done</span>${bugs?`\n<span class="er">+ ${bugs} bug (手抖了)</span>`:''}`;
    floatNum('+'+out.toFixed(0)+'%','#3ddc84',50,46);
    if(bugs){SFX.bad();shake();flashMood('angry');}else{SFX.good();flashMood('focus');}
    say(S.rageMode?'"键盘冒烟了！"':'"自己来还快点。"');
    tweenProgress(S.proj.done+out,()=>{const b=$('contBtn');if(b){b.disabled=false;b.textContent='继续 →';b.onclick=()=>{SFX.tap();go('work');};}});
  });
};

/* SETTLE — day report with money tick */
function scrSettle(){
  closeOverlay();setMood('focus');
  // compute
  const sanDrain=Math.round(S.rage*.045);
  const BURN=65; // 每日运营/生活开销
  const gross=S.proj.done*1.2+S.proj.users*0.25-S.proj.bugs*6;
  const income=Math.round(gross-BURN);
  const grow=Math.round(S.proj.done*0.32-S.proj.bugs*1.4);
  // night event
  let nightTxt='今晚平安无事。';let nightEff=()=>{};
  const r=Math.random();
  if(r<.16){nightTxt='🌙 深夜 emo，对着天花板怀疑人生。';nightEff=()=>delta('sanity',-15);}
  else if(r<.32){nightTxt='💡 半夜灵感爆发，偷偷多写了一点！';nightEff=()=>{delta('rage',6);S.proj.done=clamp(S.proj.done+5);};}
  else if(r<.42&&S.proj.debt>0){nightTxt='🚨 技术债爆雷：线上半夜出事故！';nightEff=()=>{S.proj.bugs+=2;};}
  panel(`<div class="ptag">🌙 今日日报</div>
    <div class="sheet report">
      <h2>Day ${S.day} 结算</h2>
      <div class="row"><span>📊 项目进度</span><b>${Math.round(S.proj.done)}%</b></div>
      <div class="row"><span>🐛 当前 bug</span><b class="${S.proj.bugs>0?'neg':''}">${S.proj.bugs}</b></div>
      <div class="row"><span>👤 用户变化</span><b class="${grow>=0?'pos':'neg'}">${grow>=0?'+':''}${grow}</b></div>
      <div class="row"><span>💵 收入 (进度+用户-bug)</span><b class="pos">+${Math.round(gross)}</b></div>
      <div class="row"><span>🔥 运营/生活开销</span><b class="neg">-${BURN}</b></div>
      <div class="row"><span>🧠 暴躁侵蚀心态</span><b class="neg">-${sanDrain}</b></div>
      <div style="text-align:center;color:#9aa;font-size:12px;margin-top:10px">💰 今日恰饭</div>
      <div class="big ${income>=0?'pos':'neg'}" id="incomeBig">¥0</div>
      <div style="text-align:center;color:#7c879b;font-size:12px;min-height:18px" id="nightTxt"></div>
      <button class="bigbtn" id="sleepBtn" style="margin-top:12px" disabled>结算中…</button>
    </div>`);
  // animate
  delta('sanity',-sanDrain,true);renderHUD();
  S.proj.users=Math.max(0,S.proj.users+grow);
  setTimeout(()=>{
    const big=$('incomeBig');let cur=0;const step=Math.max(1,Math.round(Math.abs(income)/24));
    const sign=income>=0?1:-1;
    const iv=setInterval(()=>{
      cur+=step;if(cur>=Math.abs(income)){cur=Math.abs(income);clearInterval(iv);finishSettle(income,nightTxt,nightEff);}
      big.textContent=(sign<0?'-':'+')+'¥'+cur;
      if(sign>0)SFX.coin();else SFX.tick();
    },40);
  },350);
}
function finishSettle(income,nightTxt,nightEff){
  delta('cash',income,true);renderHUD();
  if(income>=0){burst('💰',6);flashMood('happy');say('"恰饭 +'+income+'！"');}else{flashMood('annoyed');say('"又倒贴…"',true);}
  // night
  setTimeout(()=>{
    const nt=$('nightTxt');if(nt)nt.textContent=nightTxt;
    nightEff();renderHUD();
    if(nightTxt.includes('事故')){shake();redflash();SFX.bad();}
    else if(nightTxt.includes('灵感')){burst('💡',4);SFX.ding();}
    else if(nightTxt.includes('emo')){flashMood('dead');}
    delta('energy',-10+(Math.random()<.5?10:0),true);renderHUD();
    const b=$('sleepBtn');if(b){b.disabled=false;b.textContent='😴 睡觉，进入 Day '+(S.day+1)+' →';b.onclick=nextDay;}
  },700);
}
function nextDay(){
  SFX.swipe();
  if(checkEnd())return;
  S.day++;actionsToday=0;S.buffs=[];S.cupCount=Math.max(0,S.cupCount-3);
  go('wake');
}

/* END */
function checkEnd(){
  if(S.cash<=0)return end('💸','破产收场','钱烧光了，老哥含泪进厂打工。',0);
  if(S.sanity<=0)return end('🫠','彻底 Burnout','心态崩了，删库归隐，转行开麻辣烫。',0);
  if(S.proj.done>=100)return end('🚀','项目爆火被收购！','你做出来了！大厂捧着钱来收购，财务自由！',1);
  if(S.day>=S.maxDay)return S.cash>=2000?end('🎉','稳健恰饭','撑过 30 天还没饿死，独立开发站稳了。',1):end('😮‍💨','勉强活着','30 天到了，没爆富也没饿死，明天继续。',1);
  return false;
}
function end(em,title,desc,good){
  good?SFX.coin():SFX.rage();setMood(good?'happy':'dead');moodHold=1e15;closeOverlay();
  openOverlay(`<div class="end"><div class="em">${em}</div><h1>${title}</h1><p>${desc}</p>
    <p style="margin-top:12px;font-size:12px">撑了 ${S.day} 天 · 项目 ${Math.round(S.proj.done)}% · 用户 ${S.proj.users} · 余额 ¥${Math.round(S.cash)}</p>
    <button class="bigbtn" style="margin-top:20px;max-width:240px" onclick="location.reload()">🔁 再来一局</button></div>`,true);
  if(good)burst('🎉',12);
  return true;
}

/* BOOT */
$('code').textContent=CODE;
setInterval(()=>{if(Date.now()>moodHold&&Math.random()<.22&&S.phase!=='news'){const k=computeMood();const a=RANTS[k]||RANTS.annoyed;say(rand(a),k==='rage'||k==='angry');}},7000);
document.body.addEventListener('pointerdown',()=>ac(),{once:true});
renderHUD();render();
</script>
</body>
